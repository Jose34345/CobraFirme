name: Comprobación pública LIVE
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Esperar una respuesta pública válida
        env:
          URL: https://cobrafirme-py.onrender.com
        shell: bash
        run: |
          set -euo pipefail
          valid=0
          for attempt in $(seq 1 24); do
            echo "Intento HTTP $attempt / 24"
            if curl --retry 1 --max-time 15 --fail --location --silent --show-error "$URL/" -o /tmp/cobra_home.html && grep -q 'CobráFirme' /tmp/cobra_home.html; then
              valid=1
              break
            fi
            sleep 10
          done
          test "$valid" = 1
      - name: Diagnóstico de rutas de Render
        env:
          URL: https://cobrafirme-py.onrender.com
        run: |
          for path in '/' '/migracion-ueno/' '/migracion-ueno' '/migracion-ueno/index.html' '/privacidad/' '/privacidad' '/privacidad/index.html' '/recursos/checklist-cobros.csv' '/robots.txt' '/sitemap.xml'; do
            code=$(curl --max-time 15 -L -s -o /dev/null -w '%{http_code}' \"$URL$path\" || true)
            echo \"$path -> HTTP $code\"
          done
      - name: Diagnosticar páginas nuevas
        env:
          URL: https://cobrafirme-py.onrender.com
        shell: bash
        run: |
          for path in '/ahorristas/' '/observatorio/' '/sitemap.xml'; do
            code=$(curl --max-time 15 -L -s -o /tmp/pageprobe.html -w '%{http_code}' "$URL$path" || true)
            bytes=$(wc -c </tmp/pageprobe.html || echo 0)
            echo "$path -> HTTP $code, bytes=$bytes"
            if [ "$path" = '/ahorristas/' ]; then
              grep -o 'Orientarme gratis' /tmp/pageprobe.html | head -1 || echo 'Texto orientador no encontrado'
            fi
            if [ "$path" = '/observatorio/' ]; then
              grep -o 'Todavía no publicamos porcentajes' /tmp/pageprobe.html | head -1 || echo 'Texto observatorio no encontrado'
            fi
            if [ "$path" = '/sitemap.xml' ]; then
              echo "SITEMAP SIN PARÁMETROS:"
              head -c 1800 /tmp/pageprobe.html; echo
              echo "SITEMAP CON CACHE-BUSTER:"
              curl --max-time 15 -L -s "$URL/sitemap.xml?release=5530a8d" | head -c 1800; echo
            fi
          done
      - name: Validar rutas y checklist
        env:
          URL: https://cobrafirme-py.onrender.com
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "Falló la comprobación de la línea $LINENO"' ERR
          curl --max-time 20 --fail --location --silent --show-error "$URL/migracion-ueno/" -o /tmp/cobra_ueno.html
          grep -q 'Organizá tus próximos pasos' /tmp/cobra_ueno.html
          curl --max-time 20 --fail --location --silent --show-error "$URL/privacidad/" -o /tmp/cobra_privacidad.html
          grep -q 'Política de privacidad' /tmp/cobra_privacidad.html
          curl --max-time 20 --fail --location --silent --show-error "$URL/recursos/checklist-cobros.csv" -o /tmp/cobra_checklist.csv
          grep -q 'Etapa;Tarea;Estado' /tmp/cobra_checklist.csv
          curl --max-time 20 --fail --location --silent --show-error "$URL/robots.txt" -o /tmp/cobra_robots.txt
          grep -qi 'User-agent' /tmp/cobra_robots.txt
          curl --max-time 20 --fail --location --silent --show-error "$URL/sitemap.xml" -o /tmp/cobra_sitemap.xml
          grep -q 'cobrafirme-py.onrender.com' /tmp/cobra_sitemap.xml
          curl --max-time 20 --fail --location --silent --show-error "$URL/ahorristas/" -o /tmp/cobra_ahorristas.html
          grep -q 'Orientarme gratis' /tmp/cobra_ahorristas.html
          curl --max-time 20 --fail --location --silent --show-error "$URL/observatorio/" -o /tmp/cobra_observatorio.html
          grep -q 'Todavía no publicamos porcentajes' /tmp/cobra_observatorio.html
          grep -q '/ahorristas/' /tmp/cobra_sitemap.xml
          grep -q '/observatorio/' /tmp/cobra_sitemap.xml
          echo 'Smoke HTTP: páginas, sección de ahorristas, observatorio, recurso y SEO verificados.'
